name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Dependencies
      run: npm ci

    - name: Build Web App
      run: npx vite build

    - name: Sync Capacitor iOS
      # 保留仓库内已提交的 ios 工程（含 Info.plist 定位权限、图标、
      # SPM 插件依赖等原生定制），只做同步，避免生成工程丢失这些配置
      run: npx cap sync ios

    - name: Build iOS App (Unsigned IPA)
      run: |
        cd ios/App
        xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO -derivedDataPath build
        mkdir -p Payload
        cp -r build/Build/Products/Release-iphoneos/App.app Payload/
        zip -r KazNUHelper.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KazNUHelper-iOS
        path: ios/App/KazNUHelper.ipa