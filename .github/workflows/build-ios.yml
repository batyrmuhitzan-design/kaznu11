name: Build iOS IPA

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install Dependencies
      run: npm ci

    - name: Build Web App
      run: npm run build

    - name: Sync Capacitor iOS
      run: |
        npx cap sync ios

    - name: Build iOS App (Unsigned IPA)
      run: |
        cd ios/App
        xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -derivedDataPath build
        mkdir -p Payload
        cp -r build/Build/Products/Release-iphoneos/App.app Payload/
        zip -r KazNUHelper.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KazNUHelper-iOS
        path: ios/App/KazNUHelper.ipa