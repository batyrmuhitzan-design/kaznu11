# =====================================================================
# NodeBB 社区试跑栈 —— 与生产 FastAPI / SQLite / 1Panel-openresty 完全隔离
#
# 四条隔离原则（这台机器上还跑着生产）：
#   1) 只绑回环 127.0.0.1:4567；公网入口留给已有的 openresty，
#      **绝不启动 Caddy**（README 已警告 Caddy 会抢 80/443）；
#   2) 独立 compose project 名 + 独立网络，不与生产容器混用；
#   3) mem_limit 硬上限：内存超了就死在容器自己的 cgroup 内，
#      不会被宿主 OOM killer 波及生产（uvicorn 另有 OOMScoreAdjust=-500）；
#   4) 数据全在具名 volume 里，`down -v` 即彻底回滚，不碰 kaznu_helper.db。
#
# 用法（仓库根目录）：
#   cp -n deploy/nodebb/env.example deploy/nodebb/.env   # 填管理员密码
#   python3 deploy/nodebb/make-setup.py                   # 生成 setup.json（不入库）
#   docker compose -f deploy/nodebb/docker-compose.yml up -d
#   python3 deploy/nodebb/smoke.py                        # 分类/发帖/引用/投票/举报/搜索
# 回滚：docker compose -f deploy/nodebb/docker-compose.yml down -v
#
# 注意：模板文件叫 env.example 而**不是** .env.example —— 仓库 .gitignore 里有 `.env*`，
# 带前导点的模板会被静默忽略（第一次部署就踩到了：服务器上根本没有这个文件）。
# 真实配置是 deploy/nodebb/.env（被忽略），模板必须能被 git 跟踪。
# =====================================================================
name: kaznu-nodebb

services:
  nodebb:
    image: ghcr.io/nodebb/nodebb:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NODEBB_PORT:-4567}:4567"
    env_file: [.env]
    environment:
      # 反代 / 子域名部署必须让 NodeBB 知道对外真实地址，否则登录与 WebSocket 会出错
      URL: ${NODEBB_URL:-http://127.0.0.1:4567}
      TZ: ${TZ:-Asia/Almaty}
      # ------------------------------------------------------------------
      # ⚠️ 这两个变量必须显式设置（实测踩坑）：
      #   官方 entrypoint 会 `export CONFIG_DIR=... CONFIG=$CONFIG_DIR/config.json`；
      #   我们覆盖了 entrypoint，如果不补上，loader.js 就按默认路径
      #   /usr/src/app/config.json 去找 —— 那里什么都没有（config 在卷里），
      #   于是判定 "No config detected" 并再次 fork 起 web 安装器：
      #   表现为 setup 明明成功、Redis 里也有数据，但论坛就是不启动。
      # ------------------------------------------------------------------
      CONFIG_DIR: /opt/config
      CONFIG: /opt/config/config.json
    volumes:
      - nodebb-config:/opt/config
      - nodebb-uploads:/usr/src/app/public/uploads
      - nodebb-build:/usr/src/app/build
      - ./setup.json:/usr/src/app/setup.json:ro
    mem_limit: ${NODEBB_MEM_LIMIT:-448m}
    cpus: "1.0"
    # ------------------------------------------------------------------
    # 为什么覆盖官方镜像的 entrypoint（实测踩坑）：
    #   官方 Dockerfile 的默认流程是 `if [ -f /opt/config/config.json ] → 启动论坛；
    #   否则 → nodebb install（**启动浏览器安装向导**）`。我们这里是 headless 服务器，
    #   向导无人可点，容器会反复"启动向导 → 退出 → 重启"（实测 restarts=29 的循环）。
    #   而 src/cli/index.js:184 支持 `nodebb setup '<json>'` 做**非交互**安装，
    #   所以这里显式走 CLI 路径，并把 --config 固定到卷里
    #   （setup.js 默认写到 /usr/src/app/config.json —— 不在卷上，重启即丢）。
    # ------------------------------------------------------------------
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - |
        set -e
        if [ ! -f /opt/config/config.json ]; then
          echo "[nodebb] 首次安装：CLI 非交互 setup（setup.json 由 make-setup.py 生成）"
          ./nodebb setup --config=/opt/config/config.json "$(cat /usr/src/app/setup.json)"
          echo "[nodebb] setup 完成"
        fi
        echo "[nodebb] 启动论坛（前台，非 daemon）"
        exec npm start -- --config=/opt/config/config.json --no-silent --no-daemon
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # 镜像里没有 wget/curl（node:lts-slim），用 node 自己探活。
      # ⚠️ 探活路径必须是**真实存在**的路由：实测 NodeBB v4 没有 /api/ping
      #    （那会返回 404 → 容器永远 "health: starting"），而 /api/ 稳定 200。
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:4567/api/',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 20s
      timeout: 8s
      retries: 15
      start_period: 300s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  redis:
    # NodeBB 官方支持 Redis ≥ 7.2 作为**主库**：常驻内存 ~几十 MB，
    # 而 Mongo 要几百 MB —— 这台 842MB 的机器上只有 Redis 这条路。
    image: redis:7.4-alpine
    restart: unless-stopped
    # ⚠️ 必须 noeviction：Redis 当主库时逐出 key 等于 NodeBB 丢数据
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-96mb}
      - --maxmemory-policy
      - noeviction
      - --loglevel
      - warning
    volumes:
      - redis-data:/data
    mem_limit: ${REDIS_MEM_LIMIT:-160m}
    # 不发布任何端口：只有本 compose 网络内可达（NodeBB 通过服务名 redis 连）
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

volumes:
  nodebb-config:
  nodebb-uploads:
  nodebb-build:
  redis-data:
