<!doctype html>
<html lang="zh-CN">

    <title>KazNU Helper · 1losion.me</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background: radial-gradient(1200px 600px at 20% -10%, #0a1f5c, #000 65%);
        color: #f5f5f7; text-align: center; padding: 24px;
      }
      .card { max-width: 560px; }
      .logo { font-size: 42px; }
      h1 { margin: 8px 0 4px; letter-spacing: -0.5px; }
      p { color: rgba(235,235,245,0.65); line-height: 1.7; }
      a { color: #409CFF; text-decoration: none; font-weight: 600; margin: 0 8px; }
      .badges { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
      .badge {
        border: 1px solid rgba(255,255,255,0.14); border-radius: 999px;
        padding: 7px 14px; font-size: 12px; background: rgba(255,255,255,0.06);
      }
    </style>

  <body>
    <main class="card">
      <div class="logo">🎓</div>
      <h1>KazNU Helper</h1>

      <div class="badges">
        <span class="badge">✅ API&nbsp;<a href="/healthz">/healthz</a></span>
        <span class="badge">🛠&nbsp;<a href="/admin">管理后台 /admin</a></span>
        <span class="badge">📘&nbsp;<a href="/docs">API 文档 /docs</a></span>
      </div>
      <p style="margin-top:18px; font-size:12px;">
        iOS App 内已把 <code>VITE_API_URL=https://1losion.me</code> 指向本服务器。
      </p>
    </main>
  </body>
</html>
