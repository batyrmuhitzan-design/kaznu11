name: Build iOS IPA

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Dependencies
      run: npm ci

    - name: Build Web App
      run: npx vite build

    - name: Recreate iOS Native Project
      run: |
        rm -rf ios
        npx cap add ios
        npx cap sync ios
        cd ios/App && pod install || true

    - name: Build iOS App (Unsigned IPA)
      run: |
        cd ios/App
        if [ -d "App.xcworkspace" ]; then
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO -derivedDataPath build
        else
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO -derivedDataPath build
        fi
        mkdir -p Payload
        cp -r build/Build/Products/Release-iphoneos/App.app Payload/
        zip -r KazNUHelper.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KazNUHelper-iOS
        path: ios/App/KazNUHelper.ipa